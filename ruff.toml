# SPDX-License-Identifier: Apache-2.0
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", ".claude", ".agents"]

[lint]
# Pyflakes, pycodestyle and bug-prone constructs. Import sorting is left out on
# purpose: Odoo orders imports its own way (odoo first, then odoo.addons).
select = ["E", "F", "W", "B"]

[lint.per-file-ignores]
# Odoo loads submodules through package imports and manifests are bare dicts.
"**/__init__.py" = ["F401"]
"**/__manifest__.py" = ["B018"]
# Run through `odoo-bin shell`, which injects `env` into the globals.
"scripts/check_concurrency.py" = ["F821"]
