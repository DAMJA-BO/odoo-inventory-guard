name: Static checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: npm ci
      - run: npm run lint
      - run: python scripts/check_project.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_translations.py
      - run: node --input-type=module --check < pos_inventory_guard/static/src/app/payment_screen_patch.js
      - run: find pos_inventory_guard/static/src/stock -name '*.js' -exec sh -c 'node --input-type=module --check < "$1"' _ {} \;
      - run: node --experimental-vm-modules --test tests/*.test.mjs
