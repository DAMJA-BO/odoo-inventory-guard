name: Static checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_project.py
      - run: node --input-type=module --check < pos_stock_guard/static/src/app/payment_screen_patch.js
